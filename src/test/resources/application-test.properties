# Integration-test profile, matching the other five services.
#
# auth-service had no test resources at all, so AuthServiceApplicationTests
# ran with no active profile, no datasource URL, and failed with "Failed to
# determine a suitable driver class" -- a red test that had nothing to do with
# auth-service's code.
#
# Points at the THROWAWAY database (yuktisetu_test) with ddl-auto=create-drop,
# so the test builds its own schema from the entities and tears it down.
# Nothing here ever touches yuktisetu or Neon.
spring.application.name=auth-service-test
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu_test
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# auth-service SIGNS tokens, so unlike the other services it needs the private
# key too, not just the public one.
yuktisetu.jwt.private-key-path=classpath:/keys/private.pem
yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.access-token-ttl-seconds=900
yuktisetu.jwt.refresh-token-ttl-seconds=1209600
yuktisetu.jwt.issuer=auth-service

# Everything scheduled or brokered is OFF, so no background sweep can race an
# assertion.
yuktisetu.kafka.enabled=false

# Email stays ENABLED so core's EmailAutoConfiguration still publishes the
# EmailService bean -- removing it takes the whole context down. The SMTP host
# points at a dead port instead, so nothing can leave the machine.
app.email.enabled=true
app.email.default-from=test@example.test
app.email.default-from-name=Test
app.email.base-invite-url=http://localhost:3000/accept-invite
app.notification.debug=false
spring.mail.host=127.0.0.1
spring.mail.port=2525

management.health.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

# NotificationClient is @ConditionalOnProperty-gated but RoleManagementService
# takes it as a REQUIRED constructor dependency, so with the gate off the bean is
# absent and the whole context fails to start. Enabled here, pointed at a dead
# port, so the context builds and nothing can leave the machine.
yuktisetu.notification.client.enabled=true
yuktisetu.notification.base-url=http://127.0.0.1:2526
yuktisetu.notification.service-token=test-service-token
