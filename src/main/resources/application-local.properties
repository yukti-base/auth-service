spring.application.name=auth-service
server.port=8081

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu@2026
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Never let Hibernate own schema changes from an entity library in prod ?
# schema changes go through your migration tool, not auto-DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Local Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

# RS256 keypair.
# Generate with:
#   openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl rsa -pubout -in private.pem -out public.pem
#
# For local development, keep the keys at these paths.
yuktisetu.jwt.private-key-path=local-keys/private.pem
yuktisetu.jwt.public-key-path=local-keys/public.pem
yuktisetu.jwt.access-token-ttl-seconds=900
yuktisetu.jwt.refresh-token-ttl-seconds=1209600
yuktisetu.jwt.issuer=auth-service

# Placeholder policy, not signed off by TnP Cell yet.
yuktisetu.login-lockout.max-attempts=5
yuktisetu.login-lockout.lockout-window-seconds=900
