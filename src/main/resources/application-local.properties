# Never let Hibernate own schema changes from an entity library in prod ?
# schema changes go through your migration tool, not auto-DDL.
# validate, not update: every service scans org.yuktisetu.db, so more than
# one service auto-creating the same tables concurrently is a race. Exactly
# one owner does DDL -- admin-service -- and it must be started first after
# any schema change.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

