spring.application.name=auth-service
server.port=8081

# Production PostgreSQL — real values should come from environment variables
# at deploy time (e.g. Docker env vars, CI/CD secrets), never hardcoded here.
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Production Redis
spring.data.redis.host=${PROD_REDIS_HOST}
spring.data.redis.port=${PROD_REDIS_PORT}
spring.data.redis.password=${PROD_REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# RS256 keypair — production keys must be provisioned securely on the server,
# never committed to git.
yuktisetu.jwt.private-key-path=${PROD_JWT_PRIVATE_KEY_PATH}
yuktisetu.jwt.public-key-path=${PROD_JWT_PUBLIC_KEY_PATH}
yuktisetu.jwt.access-token-ttl-seconds=900
yuktisetu.jwt.refresh-token-ttl-seconds=1209600
yuktisetu.jwt.issuer=auth-service

yuktisetu.login-lockout.max-attempts=5
yuktisetu.login-lockout.lockout-window-seconds=900
