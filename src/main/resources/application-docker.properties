spring.application.name=auth-service
server.port=8081
server.servlet.context-path=/api/auth

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/yuktisetu}
spring.datasource.username=${DB_USERNAME:yuktisetu}
spring.datasource.password=${DB_PASSWORD:YuktiSetu@2026}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

yuktisetu.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:/run/secrets/jwt/private.pem}
yuktisetu.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt/public.pem}
yuktisetu.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
yuktisetu.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}
yuktisetu.jwt.issuer=${JWT_ISSUER:auth-service}

yuktisetu.login-lockout.max-attempts=${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
yuktisetu.login-lockout.lockout-window-seconds=${LOGIN_LOCKOUT_WINDOW_SECONDS:900}
