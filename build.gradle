plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.yuktisetu'
version = '0.0.1-SNAPSHOT'
description = 'auth-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // REQUIRED for the org.yuktisetu:* dependencies below. mavenCentral() only knows about
    // public artifacts — org.yuktisetu:identity-dal and friends exist only in your local Maven
    // cache (~/.m2) after you run `./gradlew publishToMavenLocal` from framework.
    // Without this line, dependency resolution fails with "could not find
    // org.yuktisetu:identity-dal" even though you just published it.
    mavenLocal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Per-context DALs — published locally from ~/YuktiSetu/framework.
    // Version must match what framework's build reports (group/version are set
    // in framework's root build.gradle: org.yuktisetu / 1.0.0-SNAPSHOT).
    implementation 'org.yuktisetu:identity-dal:1.0.0-SNAPSHOT'
    // RoleManagementService's hard-delete blocker reads student profiles and
    // dynamic field definitions. A cross-context read, to be replaced by an
    // API call in the next pass.
    implementation 'org.yuktisetu:profile-dal:1.0.0-SNAPSHOT'
    implementation 'org.yuktisetu:institute-dal:1.0.0-SNAPSHOT'
    implementation 'org.yuktisetu:core:1.0.0-SNAPSHOT'

    // For NotificationDispatchEvent only -- the payload shape shared with
    // notification-service. auth-service does not touch the outbox; its invite
    // goes over the synchronous /dispatch door because it is a single
    // low-stakes send, not a fan-out blast.
    implementation 'org.yuktisetu:messaging-dal:1.0.0-SNAPSHOT'

    // JWT (RS256 signing/verification)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
